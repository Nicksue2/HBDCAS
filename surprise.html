<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 20th Birthday, Cassy! </title>
    <link rel="stylesheet" href="style.css" />
    <script>
      if (!localStorage.getItem("auth_success")) {
        window.location.href = "index.html";
      }
    </script>
  </head>
  <body class="party-mode" id="page-surprise">
    <a
      href="index.html"
      class="lock-back-btn hidden-element"
      id="lock-btn"
      title="Re-lock System"
    >
      <img src="L1.png" class="btn-icon img-idle" alt="Lock" />
      <img src="L2.png" class="btn-icon img-hover" alt="Lock Active" />

      <img src="L3.png" class="btn-tooltip" alt="Tooltip" />
    </a>

    <div class="floating-bg hidden-element" id="bg-elements"></div>
    <canvas id="confetti-canvas"></canvas>

    <div id="photo-overlay" onclick="closePhoto(event)">
      <div class="close-modal-btn" onclick="closePhoto(event, true)">✖</div>
      <div class="music-modal-layout">
        <div class="ios-player">
          <div class="ios-album-art-container">
            <img src="CIE.png" class="ios-album-art ios-album-back" alt="Cassy" />
            <img src="lover-png.jpg" class="ios-album-art ios-album-front" id="album-front" alt="Lover" />
          </div>
          <div class="ios-track-info">
            <h2>Lover</h2>
            <p>Taylor Swift</p>
          </div>
          <div class="ios-progress-bg">
            <div class="ios-progress-fill" id="audio-progress"></div>
          </div>
          <audio id="ios-audio" src="lover-cut.mp3"></audio>
        </div>

        <div class="lyrics-section">
          <div id="lyrics-display"></div>
        </div>
      </div>

      <p class="ps-note">
        ** song choice is just for the "20 years" reference haha. happy birthday! 😁 —   nick
      </p>

      <div class="party-decor">
        <div class="cake-container" onclick="interactCake()">
          <div class="candle-body">
            <div class="flame"></div>
          </div>
          <div class="cake-body">
            <div class="cake-icing"></div>
            <div class="cake-cherry"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="main-content">
      <div class="flower-container left-1 hidden-element" id="flower-l1">
        <div class="stem stem-pink"></div>
        <div class="head head-pink">
          <div class="center-pink"></div>
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
        </div>
        <div class="leaf l1"></div>
      </div>

      <div class="flower-container left-2 hidden-element" id="flower-l2">
        <div class="stem stem-yellow"></div>
        <div class="head head-yellow">
          <div class="center-yellow"></div>
          <div class="petal petal-y p1"></div>
          <div class="petal petal-y p2"></div>
          <div class="petal petal-y p3"></div>
          <div class="petal petal-y p4"></div>
        </div>
        <div class="leaf l2"></div>
      </div>

      <div class="center-wrapper">
        <div class="envelope-wrapper" id="envelope">
          <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="seal">C</div>
            <div class="letter">
              <h1 id="letter-h1"></h1>
              <p id="letter-p"></p>
            </div>
          </div>
        </div>

        <div
          class="bouquet-wrapper hidden-element"
          id="bouquet-section"
          onclick="showMusic()"
        >
          <img src="bouquetr.png" class="bouquet-img" alt="Bouquet" />
          <div class="click-hint">↓ Click me ↓</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
